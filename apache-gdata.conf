# gdata API + MCP reverse proxy
# Include this inside the <VirtualHost *:443> block in www.critchley.biz-ssl.conf
# or drop in /etc/apache2/conf-available/ and a2enconf.
#
# htpasswd file: /etc/apache2/.htpasswd-gdata
# Create:  htpasswd -c /etc/apache2/.htpasswd-gdata <username>

<Location /api/>
    ProxyPass        http://127.0.0.1:8021/
    ProxyPassReverse http://127.0.0.1:8021/

    AuthType Basic
    AuthName "gdata API"
    AuthUserFile /etc/apache2/.htpasswd-gdata
    Require valid-user
</Location>

# MCP SSE endpoint.  Path must match SseServerTransport("/mcp/messages") in
# gdata_mcp_server.py — no prefix stripping so the /mcp/ path reaches the backend.
<Location /mcp/>
    # flushpackets=on: stream SSE events immediately, don't buffer
    ProxyPass        http://127.0.0.1:8023/mcp/ flushpackets=on
    ProxyPassReverse http://127.0.0.1:8023/mcp/

    # Prevent Apache from reusing a persistent connection for the long-lived SSE stream
    SetEnv proxy-initial-not-pooled 1

    AuthType Basic
    AuthName "gdata MCP"
    AuthUserFile /etc/apache2/.htpasswd-gdata
    Require valid-user
</Location>
