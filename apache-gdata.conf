# gdata API + MCP reverse proxy for www.critchley.biz
# Paste inside the <VirtualHost *:443> block in 100-www.critchley.biz-ssl.conf
#
# htpasswd file for /api/: /etc/apache2/.htpasswd-gdata
# Create with:  htpasswd -c /etc/apache2/.htpasswd-gdata john

# REST API — Basic Auth (used by the notes CLI)
<Location /api/>
    ProxyPass        http://127.0.0.1:8021/
    ProxyPassReverse http://127.0.0.1:8021/

    AuthType Basic
    AuthName "gdata API"
    AuthUserFile /etc/apache2/.htpasswd-gdata
    Require valid-user
</Location>

# MCP SSE — no Apache auth; Bearer token validated inside Python
<Location /mcp/>
    ProxyPass        http://127.0.0.1:8023/mcp/ flushpackets=on
    ProxyPassReverse http://127.0.0.1:8023/mcp/
    SetEnv proxy-initial-not-pooled 1
</Location>

# OAuth endpoints — no Apache auth (Python handles it)
<Location /oauth/>
    ProxyPass        http://127.0.0.1:8021/oauth/
    ProxyPassReverse http://127.0.0.1:8021/oauth/
</Location>

# RFC 8414 OAuth metadata — no auth
<Location /.well-known/oauth-authorization-server>
    ProxyPass        http://127.0.0.1:8021/.well-known/oauth-authorization-server
    ProxyPassReverse http://127.0.0.1:8021/.well-known/oauth-authorization-server
</Location>
