[pytest]
# Modern import mode: lets same-basename test files coexist across directories
# (e.g. the archived save/ copies vs. the live ones) without the legacy
# sys.modules basename clash. Requires pythonpath below so tests can still
# `import notes_web` / `import notes_browser` etc. without per-dir sys.path hacks.
addopts = --import-mode=importlib
pythonpath = . notes-browser
testpaths = .
python_files = test_*.py
# save/ is a stale archive of old module copies, not part of the suite.
norecursedirs = save .git __pycache__ backups patches design tmp *.egg-info build dist
